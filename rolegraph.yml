# Role graph for 🔍 Поиск → «Похожие роли» in the Job Radar app.
#
# Each role has `names` (synonyms: the same job under different words, RU and EN)
# and `links` to other roles: `adj` = adjacent role (close, often the same skills),
# `far` = related but further away. Links work both ways: if A links to B, B shows A.
# Names are matched as phrases, case-insensitive, with Russian endings allowed
# («аналитик данных» also finds «аналитика данных»). Add your own roles freely.
# `words` below are word equivalents for search (RU <-> EN, spellings): a query word also matches
# its equivalents, and words may come in any order («антифрод аналитик» finds «Fraud Analyst»).
# Avoid names of 1-3 letters (BA, PM): they match too much junk, so search skips them.

roles:
  data-analyst:
    names: [аналитик данных, data analyst, дата аналитик, data analytics]
    links: {bi-analyst: adj, product-analyst: adj, analytics-engineer: adj, data-quality: adj, marketing-analyst: far, business-analyst: far, data-scientist: far}
  bi-analyst:
    names: [bi аналитик, bi analyst, bi developer, bi разработчик, bi engineer, business intelligence]
    links: {reporting-analyst: adj, analytics-engineer: far}
  reporting-analyst:
    names: [reporting analyst, аналитик отчетности, report analyst]
    links: {data-analyst: adj, financial-analyst: far}
  product-analyst:
