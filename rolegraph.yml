    names: [solution architect, архитектор решений]
    links: {}
  accountant:
    names: [бухгалтер, accountant, главный бухгалтер, главбух]
    links: {}
  designer:
    names: [дизайнер, designer, ux designer, ui designer, продуктовый дизайнер, product designer]
