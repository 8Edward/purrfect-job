    links: {data-engineer: adj}
  data-engineer:
    names: [data engineer, дата инженер, инженер данных, etl developer, etl разработчик, dwh developer, dwh разработчик]
    links: {data-quality: far, ml-engineer: far, solution-architect: far}
  data-quality:
    names: [data quality, аналитик качества данных, dq engineer, dq analyst]
    links: {}
  data-scientist:
    names: [data scientist, дата сайентист, специалист по данным]
    links: {ml-engineer: adj, product-analyst: far}
  ml-engineer:
    names: [ml engineer, ml инженер, machine learning engineer, ai engineer]
    links: {}
  marketing-analyst:
    names: [маркетинговый аналитик, marketing analyst, веб аналитик, web analyst]
    links: {}
  financial-analyst:
    names: [финансовый аналитик, financial analyst, fp&a, экономист, economist]
    links: {accountant: far}
  fraud-analyst:
    names: [антифрод аналитик, фрод аналитик, fraud analyst, antifraud analyst, anti-fraud analyst, аналитик по противодействию мошенничеству, fraud specialist, антифрод специалист]
    links: {risk-analyst: adj, data-analyst: adj, aml-analyst: adj, financial-analyst: far}
  risk-analyst:
    names: [риск аналитик, risk analyst, аналитик рисков, credit risk analyst, кредитный аналитик, риск-менеджер, risk manager]
    links: {financial-analyst: adj, data-analyst: far}
  aml-analyst:
    names: [aml analyst, aml специалист, специалист по финансовому мониторингу, kyc analyst, kyc специалист, compliance analyst, комплаенс аналитик, trust and safety]
    links: {risk-analyst: adj}
  product-manager:
    names: [product manager, продакт менеджер, менеджер продукта, product owner, продакт оунер]
    links: {project-manager: adj}
  project-manager:
    names: [project manager, менеджер проектов, руководитель проектов]
    links: {}
