  - 'plata'
  - 'salmon'
  - 'uzum'
  - 'kaspi'
  - 'яндекс'
  - 'yandex'
  - 'ozon'
  - 'озон'
  - 'wildberries'
  - 'avito'
  - 'авито'
  - 'т-банк'
  - 'тинькофф'
  - 'tinkoff'
  - 'сбер'
  - 'lamoda'
  - 'vk\b'
  - 'aviasales'
  - 'kolesa'
  - 'epam'

# Channels from the shared 📡 pool ticked for newcomers (only those still in the pool count).
