# Telegram collector config.
# Copy this file to telegram/config.yml and fill in api_id / api_hash
# (get them at https://my.telegram.org -> API development tools).
# config.yml is gitignored — never commit it.

api_id: 123456
api_hash: "0123456789abcdef0123456789abcdef"

# Your bot: create it in Telegram with @BotFather (/newbot) and paste the token.
bot_token: "123456789:AAAA-your-bot-token"

# Search settings (interval, keywords, ...) live in search.default.yml / search.yml
# and can be changed from the bot: ⚙️ Настройки.

# ✉️ «Откликнуться» by email from your own Gmail (optional). Without it the app opens a ready mail draft.
# Make an app password at https://myaccount.google.com/apppasswords (needs 2-step verification on).
# smtp:
#   user: you@gmail.com
#   app_password: "abcd efgh ijkl mnop"
#   name: Your Name
# apply_dry_run: true   # tests: «Отправить» only logs, nothing is sent
