# Telegram collector config.
# Copy this file to telegram/config.yml and fill in api_id / api_hash
# (get them at https://my.telegram.org -> API development tools).
# config.yml is gitignored — never commit it.

api_id: 123456
api_hash: "0123456789abcdef0123456789abcdef"

# How far back to look. Messages already collected are skipped anyway.
lookback_days: 3

# Which chats to read:
#   all      — every group and channel you are subscribed to
#   list     — only the chats in `include` below
mode: all

# Chat titles or @usernames. Used by mode: list.
include: []

# Chat titles or @usernames to never read (work chats, family, etc).
exclude: []

# Messages shorter than this are ignored (greetings, "+", reactions).
min_length: 120

# A message is a job post when it matches at least one `job` pattern
# AND at least one `role` pattern AND no `negative` pattern.
# Patterns are case-insensitive regular expressions.
keywords:
  job:
    - 'ваканси'
    - '#вакансия'
    - '#job'
    - '\bищем\b'
    - 'в команду'
    - 'требуется'
    - 'hiring'
    - "we're looking for"
    - 'we are looking for'
    - 'open position'
    - '\bjob\b'
    - '\bvacancy\b'
    - 'зарплат'
    - 'вилка'
    - '\bsalary\b'
  role:
    - 'аналитик'
    - '\banalyst\b'
    - 'analytics'
    - '\bdata\b'
    - '\bданных\b'
    - '\bsql\b'
    - '\bbi\b'
    - '\betl\b'
    - '\bdwh\b'
    - '\bdbt\b'
    - 'airflow'
    - 'greenplum'
    - 'clickhouse'
    - 'tableau'
    - 'power ?bi'
    - 'superset'
    - 'looker'
  negative:
    - '#резюме'
    - '#ищу'
    - '#cv\b'
    - '\bищу работу\b'
    - 'looking for a job'
    - 'open to work'
  # These don't filter anything, they only add a tag to the pipeline line.
  tags:
    part-time:
      - 'парт-?тайм'
      - 'part-?time'
      - 'частичн'
      - 'подработк'
      - 'фриланс'
      - 'freelance'
      - '\bпроект\w*\b.{0,30}\b(час|ч/нед)'
      - '\d{2}\s*(ч|час\w*)\s*/?\s*(в\s*)?нед'
    contract:
      - 'контракт'
      - 'contract'
      - '\bb2b\b'
      - '\bип\b'
      - 'самозанят'
    remote:
      - 'удал[её]н'
      - '\bremote\b'
      - 'из любой точки'
      - 'anywhere'
